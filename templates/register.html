{% extends 'base.html' %}

{% block title %}Student Registration - SkillBridge AI{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-8 col-lg-6">
        <div class="glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-purple bg-opacity-25 text-purple mb-3" style="background: rgba(139, 92, 246, 0.2);">
                    <i class="bi bi-person-plus-fill fs-1 text-primary"></i>
                </div>
                <h2 class="font-heading mb-1">Create Student Account</h2>
                <p class="text-muted">Register to unlock resume AI analysis & job readiness prediction</p>
            </div>

            <form method="POST" action="{{ url_for('register') }}">
                <div class="row g-3">
                    <div class="col-md-12">
                        <label for="name" class="form-label">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control form-control-glass" id="name" name="name" placeholder="John Doe" required>
                        </div>
                    </div>

                    <div class="col-md-12">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control form-control-glass" id="email" name="email" placeholder="john.doe@university.edu" required>
                        </div>
                    </div>

                    <div class="col-md-12">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control form-control-glass" id="password" name="password" placeholder="Minimum 6 characters" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="department" class="form-label">Department</label>
                        <select class="form-select form-control-glass" id="department" name="department" required>
                            <option value="" disabled selected>Select Department</option>
                            <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                            <option value="Artificial Intelligence & ML">Artificial Intelligence & ML</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Data Science">Data Science</option>
                            <option value="Electronics & Communication">Electronics & Communication</option>
                            <option value="Electrical Engineering">Electrical Engineering</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="year" class="form-label">Year of Study</label>
                        <select class="form-select form-control-glass" id="year" name="year" required>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4" selected>4th Year</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="cgpa" class="form-label">CGPA (0 - 10)</label>
                        <input type="number" step="0.01" min="0" max="10" class="form-control form-control-glass" id="cgpa" name="cgpa" placeholder="8.5" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-gradient-primary w-100 py-3 mt-4 mb-3">
                    <i class="bi bi-check-circle me-2"></i> Register Account
                </button>

                <div class="text-center">
                    <p class="text-muted mb-0">Already registered? <a href="{{ url_for('login') }}" class="text-primary text-decoration-none fw-semibold">Sign in here</a></p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
