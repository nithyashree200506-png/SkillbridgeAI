{% extends 'base.html' %}

{% block title %}Login - SkillBridge AI{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-primary bg-opacity-25 text-primary mb-3">
                    <i class="bi bi-person-badge fs-1"></i>
                </div>
                <h2 class="font-heading mb-1">Welcome Back</h2>
                <p class="text-muted">Sign in to access your placement readiness dashboard</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control form-control-glass" id="email" name="email" placeholder="student@university.edu" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control form-control-glass" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-gradient-primary w-100 py-3 mb-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
                </button>

                <div class="text-center mt-3">
                    <p class="text-muted mb-0">Don't have an account? <a href="{{ url_for('register') }}" class="text-primary text-decoration-none fw-semibold">Register here</a></p>
                </div>
            </form>

            <hr class="my-4 border-secondary opacity-25">
            <div class="bg-dark bg-opacity-50 p-3 rounded-3 text-center border border-secondary border-opacity-25">
                <small class="text-muted d-block"><i class="bi bi-shield-check text-info me-1"></i> Admin Credentials:</small>
                <small class="text-info font-monospace">admin@skillbridge.ai / admin123</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
